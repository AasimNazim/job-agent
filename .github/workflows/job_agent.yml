name: Autonomous Job Agent

on:
  schedule:
    # Runs every 2 hours from 08:00 to 22:00 Pakistan Standard Time (PKT)
    # PKT is UTC+5, so this translates to 03:00 to 17:00 UTC
    # 03:00 UTC = 08:00 PKT, 05:00 UTC = 10:00 PKT, ..., 17:00 UTC = 22:00 PKT
    - cron: '0 3,5,7,9,11,13,15,17 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    # We need contents: write to be able to push the database back
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Important: Fetch full history so we can commit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Setup Credentials
        env:
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}
        run: |
          # Reconstruct token.json from base64 secret
          echo "$GMAIL_TOKEN_B64" | base64 --decode > token.json
          
      - name: Run Job Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m job_agent
          
      - name: Commit and Push Database State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add job_agent.db
          # Only commit and push if there are changes to the DB
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update job_agent.db state [skip ci]" && git push)
