name: Autonomous Job Agent

on:
  schedule:
    # Runs every 2 hours from 08:00 to 22:00 Pakistan Standard Time (PKT)
    # PKT is UTC+5, so this translates to 03:00 to 17:00 UTC
    # 03:00 UTC = 08:00 PKT, 05:00 UTC = 10:00 PKT, ..., 17:00 UTC = 22:00 PKT
    - cron: '0 3,5,7,9,11,13,15,17 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-agent:
    concurrency:
      group: autonomous-job-agent-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    
    # We need contents: write to be able to push the database back
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Important: Fetch full history so we can commit and re-sync against main.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          
      - name: Setup Credentials
        env:
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}
        run: |
          # Reconstruct token.json from base64 secret
          echo "$GMAIL_TOKEN_B64" | base64 --decode > token.json
          
      - name: Run Job Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: src
        run: |
          python -m job_agent
          
      - name: Commit and Push Database State
        run: |
          set -e
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Preserve the generated DB state before syncing with the latest remote branch.
          if [ -f job_agent.db ]; then
            git stash push -m "job_agent.db before sync" -- job_agent.db || true
          fi

          # Ignore generated egg-info metadata produced by editable installs.
          git restore --staged --worktree src/job_agent.egg-info 2>/dev/null || true

          git fetch origin main --prune
          git rebase origin/main

          # Restore the database change after the branch is synchronized.
          git stash pop || true

          git add job_agent.db

          # Only commit and push when the database actually changed.
          if git diff --cached --quiet -- job_agent.db; then
            echo "No database changes to commit."
            exit 0
          fi

          git commit -m "chore: auto-update job_agent.db state [skip ci]"
          git push origin HEAD:main
