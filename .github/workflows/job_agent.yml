name: Autonomous Job Agent

on:
  schedule:
    # Runs every 2 hours from 08:00 to 22:00 Pakistan Standard Time (PKT)
    # PKT is UTC+5, so this translates to 03:00 to 17:00 UTC
    # 03:00 UTC = 08:00 PKT, 05:00 UTC = 10:00 PKT, ..., 17:00 UTC = 22:00 PKT
    - cron: '0 3,5,7,9,11,13,15,17 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-agent:
    concurrency:
      group: autonomous-job-agent-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          
      - name: Setup Credentials
        env:
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}
        run: |
          # Reconstruct token.json from base64 secret
          echo "$GMAIL_TOKEN_B64" | base64 --decode > token.json
          
      - name: Run Job Agent
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: src
        run: |
          python -m job_agent
