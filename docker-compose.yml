services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_agent_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=dashboard/backend
      - DASHBOARD_API_TOKEN=${DASHBOARD_API_TOKEN}
      - DASHBOARD_DATABASE_URL=sqlite:////app/job_agent.db
      - DASHBOARD_CORS_ORIGINS=${DASHBOARD_CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:8080,http://localhost:80}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEMO_MODE=${DEMO_MODE:-true}
      - DEMO_MASK_SENSITIVE_DATA=${DEMO_MASK_SENSITIVE_DATA:-true}
    volumes:
      - ./job_agent.db:/app/job_agent.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_agent_scheduler
    restart: unless-stopped
    command: bash -c "while true; do echo '[$(date)] Running agent scheduler...'; python -m src.job_agent || echo 'Agent run encountered an error.'; sleep 7200; done"
    environment:
      - DASHBOARD_DATABASE_URL=sqlite:////app/job_agent.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEMO_MODE=${DEMO_MODE:-true}
      - DEMO_MASK_SENSITIVE_DATA=${DEMO_MASK_SENSITIVE_DATA:-true}
    volumes:
      - ./job_agent.db:/app/job_agent.db
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend-design
      dockerfile: Dockerfile
    container_name: job_agent_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
